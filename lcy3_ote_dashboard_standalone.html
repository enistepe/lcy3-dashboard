  <style>
:root{--bg:#0f172a;--bgc:#1e293b;--bgi:#0f172a;--bdr:#334155;--txt:#f1f5f9;--txs:#94a3b8;--txm:#64748b;--grn:#36b37e;--red:#de350b;--ylw:#ff991f;--blu:#0052CC;--prp:#6554C0}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--txt);padding:24px;min-height:100vh}
h1{font-size:22px;font-weight:700;margin:0}.sub{font-size:13px;color:var(--txm);margin-bottom:20px}.tag{font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;background:rgba(0,82,204,.2);color:#5a9aff;margin-left:12px}
.upload-row{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.uz{border:2px dashed var(--bdr);border-radius:10px;padding:18px 12px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bgc);flex:1;min-width:180px}
.uz:hover,.uz.dragover{border-color:var(--blu);background:rgba(0,82,204,.08)}.uz .icon{font-size:24px;margin-bottom:4px}.uz .title{font-size:12px;font-weight:600;margin-bottom:2px}.uz .hint{font-size:10px;color:var(--txm)}.uz input{display:none}.uz .fname{font-size:11px;color:var(--grn);font-weight:600;margin-top:4px}.uz.loaded{border-color:var(--grn);border-style:solid}
.wi{font-size:12px;color:var(--txs);margin-bottom:16px;padding:8px 14px;background:var(--bgc);border-radius:8px;border:1px solid var(--bdr)}.wi strong{color:var(--txt)}
.ss{background:var(--bgc);border:1px solid var(--bdr);border-radius:10px;padding:16px;margin-bottom:14px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}.sh .dt{width:14px;height:14px;border-radius:50%;flex-shrink:0}.sh h2{font-size:16px;font-weight:700}.sh .bd{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;font-family:'SF Mono','Cascadia Code','Consolas',monospace}.bd.p{background:rgba(54,179,126,.15);color:var(--grn)}.bd.f{background:rgba(222,53,11,.15);color:var(--red)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mb{background:var(--bgi);border:1px solid var(--bdr);border-radius:8px;padding:6px;position:relative}.mb.clk{cursor:pointer;transition:border-color .2s}.mb.clk:hover{border-color:var(--blu)}.mb .ch{position:absolute;top:4px;right:6px;font-size:9px;color:var(--txm);opacity:0;transition:opacity .2s}.mb.clk:hover .ch{opacity:1}
.dp{background:var(--bgi);border:1px solid var(--blu);border-radius:8px;padding:10px;margin-top:8px;display:none}.dp.open{display:block}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.dh span{font-size:12px;font-weight:600;color:var(--blu)}.dc{cursor:pointer;font-size:16px;color:var(--txm);padding:2px 6px;border-radius:4px}.dc:hover{color:var(--txt);background:var(--bdr)}
.dg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.db{background:var(--bgc);border:1px solid var(--bdr);border-radius:6px;padding:4px}
.ft{text-align:center;font-size:11px;color:var(--txm);margin-top:16px;padding-top:12px;border-top:1px solid var(--bdr)}
#dashboard{display:none}.ph{text-align:center;padding:50px 20px;color:var(--txm);font-size:14px}
@media(max-width:900px){.g4,.dg{grid-template-columns:repeat(2,1fr)}}

  </style>

<body>

<div style="display:flex;align-items:center;margin-bottom:4px"><h1>LCY3 OTE Dashboard</h1><span class="tag">DRILL-DOWN</span></div>
<div class="sub">Upload files → Availability &amp; Efficiency charts are clickable for drill-down into top 4 failure reasons</div>

<div class="upload-row">
  <div class="uz" id="z1"><div class="icon">📊</div><div class="title">OTE Breakdown</div><div class="hint">Required</div><input type="file" id="f1" accept=".xlsx,.xls"><div class="fname" id="n1"></div></div>
  <div class="uz" id="z2"><div class="icon">🔍</div><div class="title">Availability Deep Dive</div><div class="hint">Optional → drill-down</div><input type="file" id="f2" accept=".xlsx,.xls"><div class="fname" id="n2"></div></div>
  <div class="uz" id="z3"><div class="icon">⚙</div><div class="title">Efficiency Deep Dive</div><div class="hint">Optional → drill-down</div><input type="file" id="f3" accept=".xlsx,.xls"><div class="fname" id="n3"></div></div>
</div>

<script>

function renderSlamDD(sk,metric){

  var sm=ST.slamMachines;if(!sm)return;

  });
}

function genLastWeekReport(){
  if(!ST.ote||!ST.weeks){alert('Upload OTE Breakdown first');return;}
  var wk=ST.weeks[ST.weeks.length-1]; // last week
  var wIdx=3; // index in the 4-week arrays (last one)

  // Collect data
  var systems=[
    {key:'ib',name:'IB Sorter',color:'0052CC'},
    {key:'sh',name:'Ship Sorter',color:'DE350B'},
    {key:'sl',name:'SLAM',color:'FF991F'},
    {key:'to',name:'Tote Sorter',color:'36B37E'}
  ];

  var D=ST.ote;
  var sections=[];

  systems.forEach(function(sys){
    var d=D[sys.key];
    var ote=d.ote[wIdx],av=d.avail[wIdx],qu=d.qual[wIdx],ef=d.eff[wIdx];
    var pass=ote!=null&&ote>=0.95;

    var sec={name:sys.name,color:sys.color,pass:pass,
      ote:ote!=null?(ote*100).toFixed(2)+'%':'N/A',
      avail:av!=null?(av*100).toFixed(2)+'%':'N/A',
      qual:qu!=null?(qu*100).toFixed(2)+'%':'N/A',
      eff:ef!=null?(ef*100).toFixed(2)+'%':'N/A',
      availOffenders:[],
      effOffenders:[]
    };

    // Availability offenders
    if(ST.avail&&ST.avail[sys.key]){
      var ad=ST.avail[sys.key];
      var reasons=Object.keys(ad);
      reasons.sort(function(a,b){return(ad[b][wIdx]||0)-(ad[a][wIdx]||0)});
      reasons.slice(0,4).forEach(function(r){
        var v=ad[r][wIdx]||0;
        if(v>0) sec.availOffenders.push({reason:r,value:(v*100).toFixed(2)+'%'});
      });
    }

    // SLAM individual machines for avail
    if(sys.key==='sl'&&ST.slamMachines){
      var sm=ST.slamMachines;
      var names=Object.keys(sm).sort();
      sec.slamAvail=[];
      names.forEach(function(n){
        var v=sm[n].avail[wIdx];
        if(v!=null) sec.slamAvail.push({name:n,value:(v*100).toFixed(2)+'%'});
      });
    }

    // Efficiency offenders (technical only)
    if(ST.effic&&ST.effic[sys.key]){
      var ed=ST.effic[sys.key];
      var ereasons=Object.keys(ed);
      ereasons.sort(function(a,b){return(ed[b][wIdx]||0)-(ed[a][wIdx]||0)});
      ereasons.slice(0,4).forEach(function(r){
        var v=ed[r][wIdx]||0;
        if(v>0) sec.effOffenders.push({reason:r,value:(v*100).toFixed(2)+'%'});
      });
    }

    sections.push(sec);
  });

  // Build Word document using docx.js
  var D2=docx;
  var children=[];

  // Title
  children.push(new D2.Paragraph({
    children:[new D2.TextRun({text:'LCY3 OTE Report — Week '+wk,bold:true,size:32,font:'Calibri'})],
    spacing:{after:200}
  }));
  children.push(new D2.Paragraph({
    children:[new D2.TextRun({text:'Generated: '+new Date().toLocaleDateString('en-GB'),size:20,color:'666666',font:'Calibri'})],
    spacing:{after:400}
  }));

  sections.forEach(function(sec){
    // System header
    children.push(new D2.Paragraph({
      children:[
        new D2.TextRun({text:sec.name,bold:true,size:28,font:'Calibri',color:sec.color}),
        new D2.TextRun({text:'  —  '+(sec.pass?'PASS':'FAIL'),bold:true,size:28,font:'Calibri',color:sec.pass?'36B37E':'DE350B'})
      ],
      spacing:{before:300,after:100},
      border:{bottom:{color:sec.color,space:1,style:D2.BorderStyle.SINGLE,size:6}}
    }));

    // OTE
    children.push(new D2.Paragraph({
      children:[
        new D2.TextRun({text:'OTE: ',bold:true,size:22,font:'Calibri'}),
        new D2.TextRun({text:sec.ote,size:22,font:'Calibri',bold:true,color:sec.pass?'36B37E':'DE350B'})
      ],spacing:{before:100,after:60}
    }));

    // Availability
    children.push(new D2.Paragraph({
      children:[
        new D2.TextRun({text:'Availability: ',bold:true,size:22,font:'Calibri'}),
        new D2.TextRun({text:sec.avail,size:22,font:'Calibri'})
      ],spacing:{before:80,after:40}
    }));
    if(sec.availOffenders.length>0){
      children.push(new D2.Paragraph({
        children:[new D2.TextRun({text:'Top Availability Loss Reasons:',italics:true,size:20,font:'Calibri',color:'666666'})],
        spacing:{after:20}
      }));
      sec.availOffenders.forEach(function(o){
        children.push(new D2.Paragraph({
          children:[new D2.TextRun({text:'  •  '+o.reason+': '+o.value,size:20,font:'Calibri'})],
          indent:{left:400},spacing:{after:10}
        }));
      });
    }
    if(sec.slamAvail&&sec.slamAvail.length>0){
      children.push(new D2.Paragraph({
        children:[new D2.TextRun({text:'Individual SLAM Availability:',italics:true,size:20,font:'Calibri',color:'666666'})],
        spacing:{before:40,after:20}
      }));
      sec.slamAvail.forEach(function(s){
        children.push(new D2.Paragraph({
          children:[new D2.TextRun({text:'  •  '+s.name+': '+s.value,size:20,font:'Calibri'})],
          indent:{left:400},spacing:{after:10}
        }));
      });
    }

    // Quality
    children.push(new D2.Paragraph({
      children:[
        new D2.TextRun({text:'Quality: ',bold:true,size:22,font:'Calibri'}),
        new D2.TextRun({text:sec.qual,size:22,font:'Calibri'})
      ],spacing:{before:80,after:40}
    }));

    // Eff Tech
    children.push(new D2.Paragraph({
      children:[
        new D2.TextRun({text:'Efficiency Technical: ',bold:true,size:22,font:'Calibri'}),
        new D2.TextRun({text:sec.eff,size:22,font:'Calibri'})
      ],spacing:{before:80,after:40}
    }));
    if(sec.effOffenders.length>0){
      children.push(new D2.Paragraph({
        children:[new D2.TextRun({text:'Top Technical Efficiency Loss Reasons:',italics:true,size:20,font:'Calibri',color:'666666'})],
        spacing:{after:20}
      }));
      sec.effOffenders.forEach(function(o){
        children.push(new D2.Paragraph({
          children:[new D2.TextRun({text:'  •  '+o.reason+': '+o.value,size:20,font:'Calibri'})],
          indent:{left:400},spacing:{after:10}
        }));
      });
    }
  });

  // Create document
  var doc=new D2.Document({
    sections:[{
      properties:{page:{margin:{top:1000,bottom:1000,left:1200,right:1200}}},
      children:children
    }]
  });

  // Generate and download
  D2.Packer.toBlob(doc).then(function(blob){
    saveAs(blob,'LCY3_OTE_Week_'+wk+'_Report.docx');
  });
}


</script>

<script>

Highcharts.setOptions({chart:{backgroundColor:'transparent',style:{fontFamily:'-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'}},credits:{enabled:false}});
var MN={ote:'OTE',avail:'Availability',qual:'Quality',eff:'Eff Tech'};
var SK=['ib','sh','sl','to'],SN={ib:'IB Sorter',sh:'Ship Sorter',sl:'SLAM',to:'Tote Sorter'};
var SC={ib:'#0052CC',sh:'#de350b',sl:'#ff991f',to:'#36b37e'};
var ST={ote:null,avail:null,effic:null,weekLabels:null,weeks:null};

function sz(zi,fi,ni,cb){var z=document.getElementById(zi),f=document.getElementById(fi);z.onclick=function(){f.click()};z.ondragover=function(e){e.preventDefault();z.classList.add('dragover')};z.ondragleave=function(){z.classList.remove('dragover')};z.ondrop=function(e){e.preventDefault();z.classList.remove('dragover');if(e.dataTransfer.files.length)rx(e.dataTransfer.files[0],ni,zi,cb)};f.onchange=function(){if(f.files.length)rx(f.files[0],ni,zi,cb)};}
function rx(file,ni,zi,cb){document.getElementById(ni).textContent=file.name;document.getElementById(zi).classList.add('loaded');var r=new FileReader();r.onload=function(e){var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null});cb(rows,file.name)};r.readAsArrayBuffer(file);}
sz('z1','f1','n1',parseOTE);sz('z2','f2','n2',parseAvail);sz('z3','f3','n3',parseEffic);

// ===== PARSE OTE =====
function parseOTE(rows,fn){
  var wr=rows[6]||[],wm={};for(var i=4;i<wr.length;i+=4){if(wr[i]!=null&&wr[i]!=='')wm[i]=parseInt(wr[i]);}
  var aw=Object.values(wm).sort(function(a,b){return a-b}),l4=aw.slice(-4),wc={};for(var ci in wm){if(l4.indexOf(wm[ci])>=0)wc[wm[ci]]=parseInt(ci);}
  var ibR=null,shR=null,toR=null,slR=[];
  for(var r=7;r<rows.length;r++){var bd=(rows[r][3]||'').toString().trim();if(bd==='IB SORTER')ibR=r;if(bd==='SHIP SORTER')shR=r;if(bd==='TOTE SORTER')toR=r;if(bd.toUpperCase().indexOf('SLAM')>=0&&bd.toUpperCase()!=='SLAM'){var hd=false;for(var w=0;w<l4.length;w++){var c2=wc[l4[w]];if(rows[r][c2]!=null&&rows[r][c2]!==''&&!isNaN(rows[r][c2]))hd=true;}if(hd)slR.push(r);}}
  function pf(v){var n=parseFloat(v);return isNaN(n)?null:n;}
  function gm(ri){var o=[],a=[],q=[],ef=[];for(var w=0;w<l4.length;w++){var c=wc[l4[w]];o.push(pf(rows[ri][c]));a.push(pf(rows[ri][c+1]));q.push(pf(rows[ri][c+2]));ef.push(pf(rows[ri][c+3]));}return{ote:o,avail:a,qual:q,eff:ef};}
  function am(ris){var res={ote:[],avail:[],qual:[],eff:[]};for(var w=0;w<l4.length;w++){var c=wc[l4[w]];var s={ote:0,avail:0,qual:0,eff:0},ct={ote:0,avail:0,qual:0,eff:0};for(var j=0;j<ris.length;j++){['ote','avail','qual','eff'].forEach(function(k,ki){var v=parseFloat(rows[ris[j]][c+ki]);if(!isNaN(v)){s[k]+=v;ct[k]++;}});}['ote','avail','qual','eff'].forEach(function(k){res[k].push(ct[k]>0?s[k]/ct[k]:null);});}return res;}
  var nul={ote:[null,null,null,null],avail:[null,null,null,null],qual:[null,null,null,null],eff:[null,null,null,null]};
  // Store individual SLAM machines
  var slamMachines={};
  for(var si=0;si<slR.length;si++){
    var slamName=(rows[slR[si]][3]||'').toString().trim();
    var match=slamName.match(/SLAM\d+/);
    var label=match?match[0]:slamName;
    slamMachines[label]=gm(slR[si]);
  }
  ST.slamMachines=slamMachines;
  var D={};D.ib=ibR?gm(ibR):nul;D.sh=shR?gm(shR):nul;D.to=toR?gm(toR):nul;D.sl=slR.length?am(slR):nul;
  ST.ote=D;ST.weekLabels=l4.map(function(w){return'Wk '+w});ST.weeks=l4;renderDB(fn);
}

// ===== PARSE AVAILABILITY =====
function parseAvail(rows,fn){
  var r7=rows[7]||[],wS={};for(var i=0;i<r7.length;i++){if(r7[i]!=null&&r7[i]!=='')wS[parseInt(r7[i])]=i;}
  var sM={'IB SORTER':0,'SHIP SORTER':3,'TOTE SORTER':6};
  var l4=ST.weeks||[];if(!l4.length){alert('Upload OTE Breakdown first');return;}
  var ad={ib:{},sh:{},to:{}};
  for(var idx=10;idx<rows.length;idx++){
    var reason=(rows[idx][0]||'').toString().trim();if(!reason||reason==='Total')continue;
    ['IB SORTER','SHIP SORTER','TOTE SORTER'].forEach(function(mhe){
      var sk=mhe==='IB SORTER'?'ib':mhe==='SHIP SORTER'?'sh':'to';
      var vals=[];for(var wi=0;wi<l4.length;wi++){var wk=l4[wi];var wCol=wS[wk];if(wCol==null){vals.push(0);return;}vals.push(parseFloat(rows[idx][wCol+sM[mhe]])||0);}
      if(vals.some(function(v){return v>0}))ad[sk][reason]=vals;
    });
  }
  ST.avail=ad;if(ST.ote)renderDB();
}

// ===== PARSE EFFICIENCY =====
function parseEffic(rows,fn){
  var r7=rows[7]||[],wS={};for(var i=0;i<r7.length;i++){if(r7[i]!=null&&r7[i]!=='')wS[parseInt(r7[i])]=i;}
  var sM={'IB SORTER':0,'SHIP SORTER':4,'TOTE SORTER':8};
  var l4=ST.weeks||[];if(!l4.length){alert('Upload OTE Breakdown first');return;}
  var ed={ib:{},sh:{},to:{}};
  var inTech=false;
  for(var idx=10;idx<rows.length;idx++){
    var team=(rows[idx][0]||'').toString().trim();
    var reason=(rows[idx][1]||'').toString().trim();
    if(team==='Technical')inTech=true;
    if(team==='Operational')inTech=false;
    if(!inTech||!reason||reason.indexOf('Subtotal')>=0||reason==='Running')continue;
    ['IB SORTER','SHIP SORTER','TOTE SORTER'].forEach(function(mhe){
      var sk=mhe==='IB SORTER'?'ib':mhe==='SHIP SORTER'?'sh':'to';
      var vals=[];for(var wi=0;wi<l4.length;wi++){var wk=l4[wi];var wCol=wS[wk];if(wCol==null){vals.push(0);return;}vals.push(parseFloat(rows[idx][wCol+sM[mhe]])||0);}
      if(vals.some(function(v){return v>0}))ed[sk][reason]=vals;
    });
  }
  ST.effic=ed;if(ST.ote)renderDB();
}

// ===== RENDER =====
function renderDB(fn){
  var D=ST.ote,wl=ST.weekLabels;
  document.getElementById('ph').style.display='none';document.getElementById('dashboard').style.display='block';document.getElementById('reportBtnRow').style.display='block';
  var extras=[];if(ST.avail)extras.push('Avail Drill-Down');if(ST.effic)extras.push('Eff Drill-Down');
  document.getElementById('wi').innerHTML='<strong>Weeks:</strong> '+wl.join(', ')+(extras.length?' &nbsp;|&nbsp; <strong>Active:</strong> '+extras.join(', '):'');
  if(fn)document.getElementById('ft').textContent='Source: '+fn;
  var c=document.getElementById('sp');c.innerHTML='';
  SK.forEach(function(sk){
    var d=D[sk],lo=d.ote[3],pass=lo!=null&&lo>=.95;
    var sec=document.createElement('div');sec.className='ss';
    var hdr='<div class="sh"><div class="dt" style="background:'+SC[sk]+'"></div><h2>'+SN[sk]+'</h2><span class="bd '+(pass?'p':'f')+'">OTE '+(lo!=null?(lo*100).toFixed(2)+'%':'N/A')+' \u2014 '+(pass?'PASS':'FAIL')+'</span></div>';
    var haAD=ST.avail&&ST.avail[sk]&&Object.keys(ST.avail[sk]).length>0;
    var haED=ST.effic&&ST.effic[sk]&&Object.keys(ST.effic[sk]).length>0;
    var g='<div class="g4">';
    ['ote','avail','qual','eff'].forEach(function(mk){
      var haSD=sk==='sl'&&ST.slamMachines&&Object.keys(ST.slamMachines).length>0;var haSlOte=haSD&&mk==='ote';var haSlAvail=haSD&&mk==='avail';var haSlEff=haSD&&mk==='eff';var clk=(mk==='avail'&&(haAD||haSlAvail))||(mk==='eff'&&(haED||haSlEff))||haSlOte;
      var dtype=(mk==='avail'&&sk==='sl'&&haSlAvail)?'slam_avail':mk==='avail'?'avail':(mk==='ote'&&sk==='sl')?'slam_ote':(mk==='eff'&&sk==='sl'&&haSlEff)?'slam_eff':'eff';
      g+='<div class="mb'+(clk?' clk':'')+'"'+(clk?' onclick="togDD(\''+sk+'\',\''+dtype+'\')"':'')+'><div id="'+sk+'_'+mk+'" style="height:200px"></div>'+(clk?'<div class="ch">&#128269; drill-down</div>':'')+'</div>';
    });
    g+='</div>';
    var dpA='<div class="dp" id="dd_'+sk+'_avail"><div class="dh"><span>&#128269; Top 4 Availability Loss Reasons</span><span class="dc" onclick="togDD(\''+sk+'\',\'avail\')">&times;</span></div><div class="dg" id="ddC_'+sk+'_avail"></div></div>';
    var dpE='<div class="dp" id="dd_'+sk+'_eff"><div class="dh"><span>&#9881; Top 4 Technical Efficiency Loss Reasons</span><span class="dc" onclick="togDD(\''+sk+'\',\'eff\')">&times;</span></div><div class="dg" id="ddC_'+sk+'_eff"></div></div>';
    var dpSl='<div class="dp" id="dd_'+sk+'_slam_ote"><div class="dh"><span>&#128202; Individual SLAM Machine OTE</span><span class="dc" onclick="togDD(\''+sk+'\',\'slam_ote\')">&times;</span></div><div class="dg" id="ddC_'+sk+'_slam_ote"></div></div>';
    var dpSlA='<div class="dp" id="dd_'+sk+'_slam_avail"><div class="dh"><span>&#128269; Individual SLAM Machine Availability</span><span class="dc" onclick="togDD(\''+sk+'\',\'slam_avail\')">&times;</span></div><div class="dg" id="ddC_'+sk+'_slam_avail"></div></div>';
    var dpSlE='<div class="dp" id="dd_'+sk+'_slam_eff"><div class="dh"><span>&#9881; Individual SLAM Machine Eff Tech</span><span class="dc" onclick="togDD(\''+sk+'\',\'slam_eff\')">&times;</span></div><div class="dg" id="ddC_'+sk+'_slam_eff"></div></div>';
    sec.innerHTML=hdr+g+dpA+dpSl+dpSlA+dpSlE+dpE;c.appendChild(sec);
    ['ote','avail','qual','eff'].forEach(function(mk){mc(sk+'_'+mk,sk,mk)});
  });
}
function mc(id,sk,mk){
  var d=ST.ote[sk][mk],co=SC[sk],wl=ST.weekLabels;
  var vd=d.filter(function(v){return v!=null});
  if(!vd.length){document.getElementById(id).innerHTML='<div style="text-align:center;padding:60px 0;color:#64748b;font-size:11px">No data</div>';return;}
  var l=d[3],p=d[2],dt=(l!=null&&p!=null)?l-p:0,ds=(dt>=0?'+':'')+((dt*100).toFixed(2))+'pp';
  var mn=Math.min.apply(null,vd),ym=Math.max(0,Math.floor(mn*20)/20-.02);
  var haDD=(mk==='avail'&&ST.avail&&ST.avail[sk]&&Object.keys(ST.avail[sk]).length>0)||(mk==='eff'&&(ST.effic&&ST.effic[sk]&&Object.keys(ST.effic[sk]).length>0))||(sk==='sl'&&ST.slamMachines&&Object.keys(ST.slamMachines).length>0&&(mk==='ote'||mk==='avail'||mk==='eff'));
  Highcharts.chart(id,{chart:{type:'line',marginTop:38,marginBottom:28},title:{text:MN[mk]+(haDD?' &#128269;':'')+' <span style="font-size:15px;font-weight:700;color:'+(l>=.95?'#36b37e':l>=.93?'#ff991f':'#de350b')+'">'+(l!=null?(l*100).toFixed(2)+'%':'N/A')+'</span> <span style="font-size:10px;color:'+(dt>=0?'#36b37e':'#de350b')+'">'+ds+'</span>',useHTML:true,style:{color:'#f1f5f9',fontWeight:'600',fontSize:'11px'},align:'left'},xAxis:{categories:wl,labels:{style:{color:'#94a3b8',fontSize:'9px'}},lineColor:'#334155',tickColor:'#334155'},yAxis:{min:ym,max:1.005,gridLineColor:'#1e293b',labels:{formatter:function(){return Math.round(this.value*100)+'%'},style:{color:'#94a3b8',fontSize:'9px'}},title:{text:null},plotLines:[{value:.95,color:'#64748b',dashStyle:'Dash',width:1,zIndex:3}]},tooltip:{backgroundColor:'#1e293b',borderColor:'#334155',style:{color:'#f1f5f9',fontSize:'11px'},formatter:function(){return'<b>'+this.x+'</b><br/>'+MN[mk]+': <b>'+(this.y*100).toFixed(2)+'%</b>'}},legend:{enabled:false},plotOptions:{line:{marker:{radius:4,symbol:'circle'},lineWidth:2.5,connectNulls:true,dataLabels:{enabled:true,formatter:function(){return(this.y*100).toFixed(1)+'%'},style:{color:'#f1f5f9',fontSize:'9px',fontWeight:'600',textOutline:'2px #0f172a'},y:-8}}},series:[{name:MN[mk],data:d,color:co}]});
}

// ===== DRILL-DOWN =====
function togDD(sk,type){
  var p=document.getElementById('dd_'+sk+'_'+type);
  if(p.classList.contains('open')){p.classList.remove('open');return;}
  p.classList.add('open');renderDD(sk,type);
}
function renderDD(sk,type){
  if(type==='slam_ote'){renderSlamDD(sk,'ote');return;}
  if(type==='slam_avail'){renderSlamDD(sk,'avail');return;}
  if(type==='slam_eff'){renderSlamDD(sk,'eff');return;}
  var cId='ddC_'+sk+'_'+type,ct=document.getElementById(cId);ct.innerHTML='';
  var src=type==='avail'?ST.avail[sk]:ST.effic[sk];if(!src)return;
  var reasons=Object.keys(src);
  // Sort by latest week value desc, fallback to max
  reasons.sort(function(a,b){return(src[b][3]||0)-(src[a][3]||0)});
  if(reasons.length>0&&(src[reasons[0]][3]||0)===0){reasons.sort(function(a,b){return Math.max.apply(null,src[b])-Math.max.apply(null,src[a])});}
  var top4=reasons.slice(0,4),cols=['#de350b','#ff991f','#0052CC','#6554C0'];
  var metLabel=type==='avail'?'Avail Loss':'Impact';
  top4.forEach(function(reason,i){
    var box=document.createElement('div');box.className='db';var cid='dd_'+sk+'_'+type+'_'+i;
    box.innerHTML='<div id="'+cid+'" style="height:170px"></div>';ct.appendChild(box);
    var vals=src[reason],la=vals[3]||0,pr=vals[2]||0,dt=la-pr,ds=(dt>=0?'+':'')+((dt*100).toFixed(2))+'pp';
    Highcharts.chart(cid,{chart:{type:'line',marginTop:34,marginBottom:26},title:{text:reason+'<br/><span style="font-size:13px;font-weight:700;color:'+cols[i]+'">'+(la*100).toFixed(2)+'%</span> <span style="font-size:9px;color:'+(dt>0?'#de350b':'#36b37e')+'">'+ds+'</span>',useHTML:true,style:{color:'#f1f5f9',fontWeight:'600',fontSize:'10px'},align:'left'},xAxis:{categories:ST.weekLabels,labels:{style:{color:'#94a3b8',fontSize:'8px'}},lineColor:'#334155',tickColor:'#334155'},yAxis:{min:0,gridLineColor:'#1e293b',labels:{formatter:function(){return(this.value*100).toFixed(1)+'%'},style:{color:'#94a3b8',fontSize:'8px'}},title:{text:null}},tooltip:{backgroundColor:'#1e293b',borderColor:'#334155',style:{color:'#f1f5f9',fontSize:'11px'},formatter:function(){return'<b>'+this.x+'</b><br/>'+metLabel+': <b>'+(this.y*100).toFixed(2)+'%</b>'}},legend:{enabled:false},plotOptions:{line:{marker:{radius:4,symbol:'circle'},lineWidth:2,connectNulls:true,dataLabels:{enabled:true,formatter:function(){return(this.y*100).toFixed(2)+'%'},style:{color:'#f1f5f9',fontSize:'8px',fontWeight:'600',textOutline:'2px #0f172a'},y:-6}}},series:[{name:reason,data:vals,color:cols[i]}]});
  });
}

function renderSlamDD(sk,metric){
  if(!metric)metric='ote';
  var ct=document.getElementById('ddC_'+sk+'_slam_'+metric);ct.innerHTML='';
  var sm=ST.slamMachines;if(!sm)return;
  var names=Object.keys(sm).sort();
  var cols=['#0052CC','#36b37e','#ff991f','#de350b','#6554C0','#00B8D9','#8777D9','#00A3BF'];
  names.forEach(function(name,i){
    var d=sm[name][metric];
    var vd=d.filter(function(v){return v!=null});
    if(!vd.length)return;
    var box=document.createElement('div');box.className='db';
    var cid='dd_sl_slam_'+metric+'_'+i;
    box.innerHTML='<div id="'+cid+'" style="height:170px"></div>';
    ct.appendChild(box);
    var l=d[3],p=d[2],dt=(l!=null&&p!=null)?l-p:0;
    var ds=(dt>=0?'+':'')+((dt*100).toFixed(2))+'pp';
    var mn=Math.min.apply(null,vd),ym=Math.max(0,Math.floor(mn*20)/20-.02);
    Highcharts.chart(cid,{chart:{type:'line',marginTop:34,marginBottom:26},title:{text:name+'<br/><span style="font-size:13px;font-weight:700;color:'+(l>=.95?'#36b37e':l>=.93?'#ff991f':'#de350b')+'">'+(l!=null?(l*100).toFixed(2)+'%':'N/A')+'</span> <span style="font-size:9px;color:'+(dt>=0?'#36b37e':'#de350b')+'">'+ds+'</span>',useHTML:true,style:{color:'#f1f5f9',fontWeight:'600',fontSize:'10px'},align:'left'},xAxis:{categories:ST.weekLabels,labels:{style:{color:'#94a3b8',fontSize:'8px'}},lineColor:'#334155',tickColor:'#334155'},yAxis:{min:ym,max:1.005,gridLineColor:'#1e293b',labels:{formatter:function(){return Math.round(this.value*100)+'%'},style:{color:'#94a3b8',fontSize:'8px'}},title:{text:null},plotLines:[{value:.95,color:'#64748b',dashStyle:'Dash',width:1,zIndex:3}]},tooltip:{backgroundColor:'#1e293b',borderColor:'#334155',style:{color:'#f1f5f9',fontSize:'11px'},formatter:function(){return'<b>'+this.x+'</b><br/>'+(metric==='ote'?'OTE':metric==='avail'?'Availability':'Eff Tech')+': <b>'+(this.y*100).toFixed(2)+'%</b>'}},legend:{enabled:false},plotOptions:{line:{marker:{radius:4,symbol:'circle'},lineWidth:2,connectNulls:true,dataLabels:{enabled:true,formatter:function(){return(this.y*100).toFixed(1)+'%'},style:{color:'#f1f5f9',fontSize:'8px',fontWeight:'600',textOutline:'2px #0f172a'},y:-6}}},series:[{name:name,data:d,color:cols[i%cols.length]}]});
  });
}

function genLastWeekReport(){
  if(!ST.ote||!ST.weeks){alert('Upload OTE Breakdown first');return;}
  var wk=ST.weeks[ST.weeks.length-1]; // last week
  var wIdx=3; // index in the 4-week arrays (last one)

  // Collect data
  var systems=[
    {key:'ib',name:'IB Sorter',color:'0052CC'},
    {key:'sh',name:'Ship Sorter',color:'DE350B'},
    {key:'sl',name:'SLAM',color:'FF991F'},
    {key:'to',name:'Tote Sorter',color:'36B37E'}
  ];

  var D=ST.ote;
  var sections=[];

  systems.forEach(function(sys){
    var d=D[sys.key];
    var ote=d.ote[wIdx],av=d.avail[wIdx],qu=d.qual[wIdx],ef=d.eff[wIdx];
    var pass=ote!=null&&ote>=0.95;

    var sec={name:sys.name,color:sys.color,pass:pass,
      ote:ote!=null?(ote*100).toFixed(2)+'%':'N/A',
      avail:av!=null?(av*100).toFixed(2)+'%':'N/A',
      qual:qu!=null?(qu*100).toFixed(2)+'%':'N/A',
      eff:ef!=null?(ef*100).toFixed(2)+'%':'N/A',
      availOffenders:[],
      effOffenders:[]
    };

    // Availability offenders
    if(ST.avail&&ST.avail[sys.key]){
      var ad=ST.avail[sys.key];
      var reasons=Object.keys(ad);
      reasons.sort(function(a,b){return(ad[b][wIdx]||0)-(ad[a][wIdx]||0)});
      reasons.slice(0,4).forEach(function(r){
        var v=ad[r][wIdx]||0;
        if(v>0) sec.availOffenders.push({reason:r,value:(v*100).toFixed(2)+'%'});
      });
    }

    // SLAM individual machines for avail
    if(sys.key==='sl'&&ST.slamMachines){
      var sm=ST.slamMachines;
      var names=Object.keys(sm).sort();
      sec.slamAvail=[];
      names.forEach(function(n){
        var v=sm[n].avail[wIdx];
        if(v!=null) sec.slamAvail.push({name:n,value:(v*100).toFixed(2)+'%'});
      });
    }

    // Efficiency offenders (technical only)
    if(ST.effic&&ST.effic[sys.key]){
      var ed=ST.effic[sys.key];
      var ereasons=Object.keys(ed);
      ereasons.sort(function(a,b){return(ed[b][wIdx]||0)-(ed[a][wIdx]||0)});
      ereasons.slice(0,4).forEach(function(r){
        var v=ed[r][wIdx]||0;
        if(v>0) sec.effOffenders.push({reason:r,value:(v*100).toFixed(2)+'%'});
      });
    }

    sections.push(sec);
  });

  // Build Word document using docx.js
  var D2=docx;
  var children=[];

  // Title
  children.push(new D2.Paragraph({
    children:[new D2.TextRun({text:'LCY3 OTE Report — Week '+wk,bold:true,size:32,font:'Calibri'})],
    spacing:{after:200}
  }));
  children.push(new D2.Paragraph({
    children:[new D2.TextRun({text:'Generated: '+new Date().toLocaleDateString('en-GB'),size:20,color:'666666',font:'Calibri'})],
    spacing:{after:400}
  }));

  sections.forEach(function(sec){
    // System header
    children.push(new D2.Paragraph({
      children:[
        new D2.TextRun({text:sec.name,bold:true,size:28,font:'Calibri',color:sec.color}),
        new D2.TextRun({text:'  —  '+(sec.pass?'PASS':'FAIL'),bold:true,size:28,font:'Calibri',color:sec.pass?'36B37E':'DE350B'})
      ],
      spacing:{before:300,after:100},
      border:{bottom:{color:sec.color,space:1,style:D2.BorderStyle.SINGLE,size:6}}
    }));

    // OTE
    children.push(new D2.Paragraph({
      children:[
        new D2.TextRun({text:'OTE: ',bold:true,size:22,font:'Calibri'}),
        new D2.TextRun({text:sec.ote,size:22,font:'Calibri',bold:true,color:sec.pass?'36B37E':'DE350B'})
      ],spacing:{before:100,after:60}
    }));

    // Availability
    children.push(new D2.Paragraph({
      children:[
        new D2.TextRun({text:'Availability: ',bold:true,size:22,font:'Calibri'}),
        new D2.TextRun({text:sec.avail,size:22,font:'Calibri'})
      ],spacing:{before:80,after:40}
    }));
    if(sec.availOffenders.length>0){
      children.push(new D2.Paragraph({
        children:[new D2.TextRun({text:'Top Availability Loss Reasons:',italics:true,size:20,font:'Calibri',color:'666666'})],
        spacing:{after:20}
      }));
      sec.availOffenders.forEach(function(o){
        children.push(new D2.Paragraph({
          children:[new D2.TextRun({text:'  •  '+o.reason+': '+o.value,size:20,font:'Calibri'})],
          indent:{left:400},spacing:{after:10}
        }));
      });
    }
    if(sec.slamAvail&&sec.slamAvail.length>0){
      children.push(new D2.Paragraph({
        children:[new D2.TextRun({text:'Individual SLAM Availability:',italics:true,size:20,font:'Calibri',color:'666666'})],
        spacing:{before:40,after:20}
      }));
      sec.slamAvail.forEach(function(s){
        children.push(new D2.Paragraph({
          children:[new D2.TextRun({text:'  •  '+s.name+': '+s.value,size:20,font:'Calibri'})],
          indent:{left:400},spacing:{after:10}
        }));
      });
    }

    // Quality
    children.push(new D2.Paragraph({
      children:[
        new D2.TextRun({text:'Quality: ',bold:true,size:22,font:'Calibri'}),
        new D2.TextRun({text:sec.qual,size:22,font:'Calibri'})
      ],spacing:{before:80,after:40}
    }));

    // Eff Tech
    children.push(new D2.Paragraph({
      children:[
        new D2.TextRun({text:'Efficiency Technical: ',bold:true,size:22,font:'Calibri'}),
        new D2.TextRun({text:sec.eff,size:22,font:'Calibri'})
      ],spacing:{before:80,after:40}
    }));
    if(sec.effOffenders.length>0){
      children.push(new D2.Paragraph({
        children:[new D2.TextRun({text:'Top Technical Efficiency Loss Reasons:',italics:true,size:20,font:'Calibri',color:'666666'})],
        spacing:{after:20}
      }));
      sec.effOffenders.forEach(function(o){
        children.push(new D2.Paragraph({
          children:[new D2.TextRun({text:'  •  '+o.reason+': '+o.value,size:20,font:'Calibri'})],
          indent:{left:400},spacing:{after:10}
        }));
      });
    }
  });

  // Create document
  var doc=new D2.Document({
    sections:[{
      properties:{page:{margin:{top:1000,bottom:1000,left:1200,right:1200}}},
      children:children
    }]
  });

  // Generate and download
  D2.Packer.toBlob(doc).then(function(blob){
    saveAs(blob,'LCY3_OTE_Week_'+wk+'_Report.docx');
  });
}


</script>
